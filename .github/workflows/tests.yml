name: Build

# Every push and pull request runs the suite, so the README badge below can only
# be green while `main` is green:
#   https://github.com/mrsehajofficial/aegis/actions/workflows/tests.yml
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Actions are pinned to commit SHAs, never tags: setup-uv ships full
      # semver tags only (there is no `@v10`), and a moving tag could be
      # repointed upstream, changing what CI runs without a diff here.
      # The trailing comments track the released version each SHA is.
      #
      # uv is the project's package manager, so CI installs from the committed
      # uv.lock — the exact versions a developer gets locally, with no pip drift.
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install the project with dev dependencies
        run: uv sync --extra dev

      # The suite is self-contained: no network, no Telegram token, no database.
      - name: Run the test suite
        run: uv run --extra dev pytest -q
