<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04060a" />
      <stop offset="50%" stop-color="#080d15" />
      <stop offset="100%" stop-color="#05080e" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#00e5a0" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#00e5a0" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#101926" stroke-width="1" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#00e5a0" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background with tech grid -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.4" />

  <!-- Ambient glowing orb -->
  <circle cx="950" cy="300" r="280" fill="#00e5a0" opacity="0.07" filter="blur(60px)" />
  <circle cx="250" cy="150" r="200" fill="#00f0ff" opacity="0.04" filter="blur(60px)" />

  <!-- Decorative Border -->
  <rect x="30" y="30" width="1140" height="570" rx="16" fill="none" stroke="#162338" stroke-width="1.5" />

  <!-- Badge / Top tag -->
  <g transform="translate(80, 85)">
    <rect x="0" y="0" width="360" height="34" rx="17" fill="#0c1724" stroke="#00e5a0" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="16" cy="17" r="4" fill="#00e5a0" />
    <text x="30" y="22" fill="#00e5a0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="2">
      GUARDIAN PROTOCOL // PRODUCTION READY
    </text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="195" fill="#f0f4f8" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="64" font-weight="900" letter-spacing="-1">
    AEGIS // TELEGRAM
  </text>
  <text x="80" y="260" fill="url(#accent)" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="44" font-weight="700" letter-spacing="1">
    THE STEEL GUARDIAN
  </text>

  <!-- Author Attribution Badge -->
  <g transform="translate(80, 295)">
    <rect x="0" y="0" width="380" height="42" rx="8" fill="#0c1928" stroke="#1d3049" stroke-width="1" />
    <text x="20" y="26" fill="#8ba0b8" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="500">
      ENGINEERED BY <tspan fill="#ffffff" font-weight="700">SEHAJ VARMA</tspan>
    </text>
  </g>

  <!-- Description paragraph -->
  <text x="80" y="380" fill="#94a3b8" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="20" font-weight="400">
    Deterministic group moderation with sliding-window anti-flood,
  </text>
  <text x="80" y="412" fill="#94a3b8" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="20" font-weight="400">
    granular bitmask locks, and ACID-compliant forensic audit logs.
  </text>

  <!-- Technical Capability Pills -->
  <g transform="translate(80, 470)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="165" height="38" rx="8" fill="#0d1826" stroke="#1e324a" stroke-width="1" />
    <text x="18" y="24" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">⚡ Sub-25ms Latency</text>

    <!-- Pill 2 -->
    <rect x="180" y="0" width="180" height="38" rx="8" fill="#0d1826" stroke="#1e324a" stroke-width="1" />
    <text x="198" y="24" fill="#00e5a0" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">🛡️ Anti-Flood Window</text>

    <!-- Pill 3 -->
    <rect x="375" y="0" width="170" height="38" rx="8" fill="#0d1826" stroke="#1e324a" stroke-width="1" />
    <text x="393" y="24" fill="#f0f4f8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">📦 SQLAlchemy 2.0</text>

    <!-- Pill 4 -->
    <rect x="560" y="0" width="160" height="38" rx="8" fill="#0d1826" stroke="#1e324a" stroke-width="1" />
    <text x="578" y="24" fill="#8ba0b8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">🔒 16 Content Locks</text>
  </g>

  <!-- Footer Link URL Bar -->
  <g transform="translate(80, 545)">
    <text x="0" y="16" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="14" letter-spacing="1">
      CANONICAL: <tspan fill="#00e5a0">https://aegis.wasmer.app/</tspan> &bull; PORTFOLIO: <tspan fill="#00f0ff">https://sehaj.wasmer.app/</tspan>
    </text>
  </g>

  <!-- Large Right-Side Geometric Shield Emblem -->
  <g transform="translate(880, 190) scale(12)" filter="url(#glow)">
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" fill="#091320" stroke="url(#shieldGrad)" stroke-width="1.2" stroke-linejoin="round" />
    <path d="m9 12 2 2 4-4" fill="none" stroke="#00e5a0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
