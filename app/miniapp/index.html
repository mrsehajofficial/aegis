<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aegis Dashboard</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .toggle { position: relative; width: 48px; height: 28px; background: #374151; border-radius: 14px; cursor: pointer; transition: background 0.2s; }
    .toggle.active { background: #10b981; }
    .toggle-dot { position: absolute; top: 2px; left: 2px; width: 24px; height: 24px; background: white; border-radius: 50%; transition: transform 0.2s; }
    .toggle.active .toggle-dot { transform: translateX(20px); }
    .tab-btn.active { background: #0a0a0f; color: white; }
  </style>
</head>
<body class="bg-[#0a0a0f] text-gray-200 min-h-screen p-4">
  <div class="flex items-center gap-3 mb-5">
    <div class="w-12 h-12 rounded-full bg-gradient-to-br from-emerald-400 to-emerald-600 flex items-center justify-center text-2xl">🛡️</div>
    <div>
      <h1 class="text-lg font-semibold">Aegis Dashboard</h1>
      <p class="text-sm text-gray-500">Manage your group settings</p>
    </div>
  </div>
  <div class="flex gap-1 p-1 bg-[#14141f] rounded-xl mb-4">
    <button onclick="switchTab('settings')" class="flex-1 py-2.5 rounded-lg text-sm font-medium tab-btn" data-tab="settings">⚙️ Settings</button>
    <button onclick="switchTab('filters')" class="flex-1 py-2.5 rounded-lg text-sm font-medium tab-btn" data-tab="filters">🔍 Filters</button>
    <button onclick="switchTab('blacklist')" class="flex-1 py-2.5 rounded-lg text-sm font-medium tab-btn" data-tab="blacklist">🚫 Blacklist</button>
    <button onclick="switchTab('notes')" class="flex-1 py-2.5 rounded-lg text-sm font-medium tab-btn" data-tab="notes">📝 Notes</button>
  </div>
  <div id="tab-content"></div>
  <button onclick="showAddModal(currentTab)" class="fixed bottom-5 right-5 w-14 h-14 rounded-full bg-emerald-500 text-white text-2xl shadow-lg shadow-emerald-500/40">+</button>
  <div id="add-modal" class="fixed inset-0 bg-black/70 flex items-center justify-center z-50 hidden" onclick="if(event.target===this)closeModal()">
    <div class="bg-[#14141f] rounded-2xl p-5 w-[90%] max-w-sm">
      <h3 class="text-lg font-semibold mb-4" id="modal-title">Add Item</h3>
      <input id="modal-input-1" type="text" placeholder="Keyword / Word" class="w-full p-3 bg-[#0a0a0f] border border-gray-700 rounded-lg text-sm mb-3">
      <textarea id="modal-input-2" rows="3" placeholder="Response (if applicable)" class="w-full p-3 bg-[#0a0a0f] border border-gray-700 rounded-lg text-sm mb-3"></textarea>
      <select id="modal-select" class="w-full p-3 bg-[#0a0a0f] border border-gray-700 rounded-lg text-sm mb-3 hidden">
        <option value="delete">Delete</option><option value="warn">Warn</option><option value="mute">Mute</option><option value="ban">Ban</option>
      </select>
      <div class="flex gap-2 mt-4">
        <button onclick="closeModal()" class="flex-1 py-2.5 bg-transparent border border-gray-700 rounded-lg text-sm">Cancel</button>
        <button id="modal-save-btn" class="flex-1 py-2.5 bg-emerald-500 text-white rounded-lg text-sm">Save</button>
      </div>
    </div>
  </div>
  <template id="settings-template">
    <div class="space-y-4">
      <div class="bg-[#14141f] rounded-xl p-4">
        <div class="text-xs font-semibold text-gray-500 uppercase mb-3">Toggle Features</div>
        <div class="space-y-1">
          <div class="flex items-center justify-between py-3 border-b border-gray-800">
            <div><div class="text-sm font-medium">👋 Welcome Messages</div><div class="text-xs text-gray-500">Greet new members</div></div>
            <button onclick="toggleSetting('welcome_enabled',this)" class="toggle"><span class="toggle-dot"></span></button>
          </div>
          <div class="flex items-center justify-between py-3 border-b border-gray-800">
            <div><div class="text-sm font-medium">👋 Goodbye Messages</div><div class="text-xs text-gray-500">Announce when members leave</div></div>
            <button onclick="toggleSetting('goodbye_enabled',this)" class="toggle"><span class="toggle-dot"></span></button>
          </div>
          <div class="flex items-center justify-between py-3 border-b border-gray-800">
            <div><div class="text-sm font-medium">⚡ Anti-Flood</div><div class="text-xs text-gray-500">Mute rapid-fire posters</div></div>
            <button onclick="toggleSetting('anti_flood_enabled',this)" class="toggle"><span class="toggle-dot"></span></button>
          </div>
          <div class="flex items-center justify-between py-3">
            <div><div class="text-sm font-medium">🛡️ Anti-Spam</div><div class="text-xs text-gray-500">Delete spam content</div></div>
            <button onclick="toggleSetting('anti_spam_enabled',this)" class="toggle"><span class="toggle-dot"></span></button>
          </div>
        </div>
      </div>
      <div class="bg-[#14141f] rounded-xl p-4">
        <div class="text-xs font-semibold text-gray-500 uppercase mb-3">Warning Limit</div>
        <div class="flex gap-2"><input id="warn-limit" type="number" min="1" max="20" class="flex-1 p-3 bg-[#0a0a0f] border border-gray-700 rounded-lg" placeholder="1-20"><button onclick="saveWarnLimit()" class="px-4 py-3 bg-emerald-500 text-white rounded-lg">Save</button></div>
      </div>
      <div class="bg-[#14141f] rounded-xl p-4">
        <div class="text-xs font-semibold text-gray-500 uppercase mb-3">Welcome Message</div>
        <textarea id="welcome-msg" rows="2" class="w-full p-3 bg-[#0a0a0f] border border-gray-700 rounded-lg mb-2" placeholder="Custom welcome (empty for default)"></textarea>
        <button onclick="patchMsg('welcome_message')" class="w-full py-2 bg-emerald-500 text-white rounded-lg">Save</button>
      </div>
      <div class="bg-[#14141f] rounded-xl p-4">
        <div class="text-xs font-semibold text-gray-500 uppercase mb-3">Goodbye Message</div>
        <textarea id="goodbye-msg" rows="2" class="w-full p-3 bg-[#0a0a0f] border border-gray-700 rounded-lg mb-2" placeholder="Custom goodbye (empty for default)"></textarea>
        <button onclick="patchMsg('goodbye_message')" class="w-full py-2 bg-emerald-500 text-white rounded-lg">Save</button>
      </div>
      <div class="bg-[#14141f] rounded-xl p-4">
        <div class="text-xs font-semibold text-gray-500 uppercase mb-3">Group Rules</div>
        <textarea id="rules" rows="4" class="w-full p-3 bg-[#0a0a0f] border border-gray-700 rounded-lg mb-2" placeholder="Enter group rules..."></textarea>
        <button onclick="patchMsg('rules')" class="w-full py-2 bg-emerald-500 text-white rounded-lg">Save Rules</button>
      </div>
    </div>
  </template>
  <template id="filters-template">
    <div class="space-y-4">
      <div class="bg-[#14141f] rounded-xl p-4">
        <div class="text-xs font-semibold text-gray-500 uppercase mb-3">Auto-Reply Filters</div>
        <div class="space-y-2 max-h-60 overflow-y-auto filters-list"></div>
      </div>
    </div>
  </template>
  <template id="blacklist-template">
    <div class="space-y-4">
      <div class="bg-[#14141f] rounded-xl p-4">
        <div class="text-xs font-semibold text-gray-500 uppercase mb-3">Blacklisted Words</div>
        <div class="space-y-2 max-h-60 overflow-y-auto blacklist-list"></div>
      </div>
    </div>
  </template>
  <template id="notes-template">
    <div class="space-y-4">
      <div class="bg-[#14141f] rounded-xl p-4">
        <div class="text-xs font-semibold text-gray-500 uppercase mb-3">Saved Notes</div>
        <div class="space-y-2 max-h-60 overflow-y-auto notes-list"></div>
      </div>
    </div>
  </template>
  <script>
    const tg = window.Telegram.WebApp;
    let currentTab = 'settings';
    const chatId = tg.initDataUnsafe?.chat?.id;
    async function loadSettings() {
      try {
        const res = await fetch(`/api/v1/groups/${chatId}/settings`);
        if (!res.ok) throw new Error();
        const d = await res.json();
        document.querySelectorAll('.toggle').forEach(t => {
          const key = t.getAttribute('onclick').match(/'(w+)'/)[1];
          const on = d[key];
          t.classList.toggle('active', on);
          t.querySelector('.toggle-dot').style.transform = on ? 'translateX(20px)' : 'translateX(0)';
        });
        document.getElementById('warn-limit').value = d.warn_limit ?? 3;
        document.getElementById('welcome-msg').value = d.welcome_message || '';
        document.getElementById('goodbye-msg').value = d.goodbye_message || '';
        document.getElementById('rules').value = d.rules || '';
      } catch(e) { tg.showPopupError('Failed to load'); }
    }
    async function loadFilters() {
      try {
        const res = await fetch(`/api/v1/groups/${chatId}/filters`);
        const d = await res.json();
        const c = document.querySelector('#filters-list');
        if (!d.length) { c.innerHTML = '<div class="text-center py-6 text-gray-500">No filters. Tap + to add.</div>'; return; }
        c.innerHTML = d.map(f => `<div class="flex items-center justify-between p-3 bg-[#0a0a0f] rounded-lg"><div><div class="text-sm font-medium">/${f.trigger}</div><div class="text-xs text-gray-500 truncate">${f.response}</div></div><div class="flex items-center gap-2"><span class="text-xs px-2 py-0.5 rounded ${f.enabled?'bg-emerald-500/20 text-emerald-400':'bg-gray-700 text-gray-500'}">${f.enabled?'Active':'Off'}</span><button onclick="deleteItem('filters',${f.id})" class="text-gray-500 hover:text-red-400 p-1">✕</button></div></div>`).join('');
      } catch(e) { tg.showPopupError('Failed'); }
    }
    async function loadBlacklist() {
      try {
        const res = await fetch(`/api/v1/groups/${chatId}/blacklist`);
        const d = await res.json();
        const c = document.querySelector('#blacklist-list');
        if (!d.length) { c.innerHTML = '<div class="text-center py-6 text-gray-500">No words. Tap + to add.</div>'; return; }
        c.innerHTML = d.map(w => `<div class="flex items-center justify-between p-3 bg-[#0a0a0f] rounded-lg"><div class="flex items-center gap-3"><span class="text-sm font-medium">${w.word}</span><span class="text-xs px-2 py-0.5 rounded bg-${w.action==='delete'||w.action==='ban'?'red':'yellow'}-500/20 text-${w.action==='delete'||w.action==='ban'?'red':'yellow'}-400">${w.action}</span></div><button onclick="deleteItem('blacklist',${w.id})" class="text-gray-500 hover:text-red-400 p-1">✕</button></div>`).join('');
      } catch(e) { tg.showPopupError('Failed'); }
    }
    async function loadNotes() {
      try {
        const res = await fetch(`/api/v1/groups/${chatId}/notes`);
        const d = await res.json();
        const c = document.querySelector('#notes-list');
        if (!d.length) { c.innerHTML = '<div class="text-center py-6 text-gray-500">No notes. Tap + to add.</div>'; return; }
        c.innerHTML = d.map(n => `<div class="flex items-center justify-between p-3 bg-[#0a0a0f] rounded-lg"><div><div class="text-sm font-medium">#${n.keyword}</div><div class="text-xs text-gray-500 truncate">${n.content}</div></div><button onclick="deleteItem('notes',${n.id})" class="text-gray-500 hover:text-red-400 p-1">✕</button></div>`).join('');
      } catch(e) { tg.showPopupError('Failed'); }
    }
    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
      document.getElementById('tab-content').innerHTML = document.getElementById(`${tab}-template`).innerHTML;
      if (tab==='settings') loadSettings(); else if (tab==='filters') loadFilters(); else if (tab==='blacklist') loadBlacklist(); else loadNotes();
    }
    async function toggleSetting(key, btn) {
      const val = !btn.classList.contains('active');
      btn.classList.toggle('active', val);
      btn.querySelector('.toggle-dot').style.transform = val ? 'translateX(20px)' : 'translateX(0)';
      try {
        const res = await fetch(`/api/v1/groups/${chatId}/settings`, {method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({[key]:val})});
        if (res.ok) tg.showPopup(val?'Enabled':'Disabled'); else tg.showPopupError('Failed');
      } catch(e) { tg.showPopupError('Failed'); }
    }
    async function saveWarnLimit() {
      const v = parseInt(document.getElementById('warn-limit').value);
      if (isNaN(v)||v<1||v>20) return tg.showPopupError('Must be 1-20');
      try {
        const res = await fetch(`/api/v1/groups/${chatId}/settings`, {method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({warn_limit:v})});
        if (res.ok) tg.showPopup('Saved!'); else tg.showPopupError('Failed');
      } catch(e) { tg.showPopupError('Failed'); }
    }
    async function patchMsg(key) {
      const v = document.getElementById(key).value;
      try {
        const res = await fetch(`/api/v1/groups/${chatId}/settings`, {method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({[key]:v})});
        if (res.ok) tg.showPopup('Saved!'); else tg.showPopupError('Failed');
      } catch(e) { tg.showPopupError('Failed'); }
    }
    function showAddModal(tab) {
      const m=document.getElementById('add-modal'),t=document.getElementById('modal-title'),i1=document.getElementById('modal-input-1'),i2=document.getElementById('modal-input-2'),s=document.getElementById('modal-select'),b=document.getElementById('modal-save-btn');
      if (tab==='filters') { t.textContent='Add Filter'; i1.placeholder='Trigger (e.g., hello)'; i2.placeholder='Reply message'; s.classList.add('hidden'); b.onclick=()=>createItem('filters',i1.value,i2.value); }
      else if (tab==='blacklist') { t.textContent='Add Word'; i1.placeholder='Word to block'; i2.classList.add('hidden'); s.classList.remove('hidden'); b.onclick=()=>createItem('blacklist',i1.value,s.value); }
      else { t.textContent='Save Note'; i1.placeholder='Keyword'; i2.placeholder='Content'; s.classList.add('hidden'); b.onclick=()=>createItem('notes',i1.value,i2.value); }
      m.classList.remove('hidden'); setTimeout(()=>i1.focus(),100);
    }
    function closeModal() { document.getElementById('add-modal').classList.add('hidden'); }
    async function createItem(type,v1,v2) {
      if (!v1) return tg.showPopupError('Fill required field');
      const url=`/api/v1/groups/${chatId}/${type==='notes'?'notes':type}`;
      const body=type==='filters'?JSON.stringify({trigger:v1,response:v2,enabled:true}):type==='blacklist'?JSON.stringify({word:v1,action:v2}):JSON.stringify({keyword:v1,content:v2});
      try {
        const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body});
        if (res.ok) { tg.showPopup('Added!'); closeModal(); switchTab(currentTab); } else tg.showPopupError('Failed');
      } catch(e) { tg.showPopupError('Failed'); }
    }
    async function deleteItem(type,id) {
      if (!confirm('Delete?')) return;
      try {
        const res=await fetch(`/api/v1/groups/${chatId}/${type}/${id}`,{method:'DELETE'});
        if (res.ok) { tg.showPopup('Deleted'); switchTab(currentTab); } else tg.showPopupError('Failed');
      } catch(e) { tg.showPopupError('Failed'); }
    }
    tg.ready(); tg.expand(); switchTab('settings');
  </script>
</body>
</html>
